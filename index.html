<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouCut video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Pacifico&family=Montserrat:wght@400;800&family=Lobster&family=Oswald:wght@500&family=Playfair+Display:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de trabajo nocturna, sobria y táctil, como una app móvil llevada al escritorio
   IDEA: la mesa de montaje de bolsillo: pantalla arriba, cinta de clips abajo, cabezal fijo en el centro
   PICTURE: la propia vista previa del vídeo y la línea de tiempo con miniaturas y ondas
   COLOUR and TYPE: grafito #121418, coral #ff4d6a como acento, ámbar para audio, azul para texto; Inter
   LAYOUT: cabecera fina, vista previa flexible, barra de transporte, línea de tiempo, herramientas en carrusel horizontal */
:root{color-scheme:dark;--bg:#0e1013;--p1:#16191e;--p2:#1e2228;--p3:#2a2f37;--ln:#323843;--ink:#eef1f5;--mut:#8d96a3;--acc:#ff4d6a;--aud:#f2b632;--aud2:#3cc9a8;--txt:#4da3ff;--stk:#d07cff;--v2:#7d8cff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100vh}
header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--p1);border-bottom:1px solid var(--ln);flex:none}
.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo svg{width:16px;height:16px;fill:#fff}
#pname{background:transparent;border:1px solid transparent;color:var(--ink);font-weight:600;font-size:16px;padding:6px 8px;border-radius:8px;width:220px}
#pname:hover,#pname:focus{border-color:var(--ln);outline:none}
.sp{flex:1}
.hbtn{height:36px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.hbtn:hover{background:var(--p2);color:var(--ink)}
.hbtn:disabled{opacity:.35;pointer-events:none}
#btnExport{background:var(--acc);color:#fff;font-weight:600;padding:0 18px}
#btnExport:hover{filter:brightness(1.1);background:var(--acc)}
#stage{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;position:relative;background:#08090b;overflow:hidden}
#cv{display:block;background:#000;box-shadow:0 8px 40px #0008;cursor:default;touch-action:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#empty h2{margin:0;font-size:28px;line-height:1.1}
#empty p{margin:0;color:var(--mut);max-width:440px}
.big{background:var(--acc);color:#fff;font-weight:600;height:46px;padding:0 22px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:15px}
.big:hover{filter:brightness(1.1)}
#drop{position:absolute;inset:10px;border:2px dashed var(--acc);border-radius:16px;background:#ff4d6a14;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600;z-index:5}
#transport{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--p1);border-top:1px solid var(--ln)}
#tc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);white-space:nowrap;min-width:150px}
#tc b{color:var(--ink);font-weight:600}
#play{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#000;display:grid;place-items:center;margin:0 auto}
#play svg{fill:#000;stroke:none;width:18px;height:18px}
.ibtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.ibtn:hover{background:var(--p2);color:var(--ink)}
.ibtn:disabled{opacity:.3;pointer-events:none}
#zoom{width:90px;accent-color:var(--acc)}
.tw{position:relative;flex:none;height:clamp(190px,34vh,330px);background:var(--p1);border-top:1px solid var(--ln)}
#tl{position:absolute;inset:0;overflow-x:scroll;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--p3) transparent}
#tli{position:relative;min-height:100%}
#ph{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:20;box-shadow:0 0 0 1px #0006}
#ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#fff}
.ruler{position:sticky;top:0;height:22px;z-index:12;background:var(--p1);border-bottom:1px solid var(--ln)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--ln);font-size:10px;color:var(--mut);padding-left:3px;line-height:22px;white-space:nowrap}
.tick.m{height:6px;top:16px}
.row{position:relative;border-bottom:1px solid #ffffff08}
.rlab{position:sticky;left:0;z-index:9;display:inline-flex;align-items:center;gap:4px;height:18px;margin:3px 0 0 6px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:600;background:#0e1013d0;color:var(--mut);pointer-events:none;white-space:nowrap}
.hint{position:absolute;top:3px;bottom:3px;border:1px dashed var(--ln);border-radius:7px;color:var(--mut);font-size:11px;display:flex;align-items:center;padding:0 10px;cursor:pointer;white-space:nowrap}
.hint:hover{border-color:var(--mut);color:var(--ink)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:7px;overflow:hidden;cursor:grab;background:var(--p3);box-shadow:inset 0 0 0 1px #ffffff14}
.clip.sel{box-shadow:0 0 0 2px #fff;z-index:5;overflow:visible}
.clip .tiles{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:7px}
.clip .tile{flex:none;height:100%;background-repeat:no-repeat;opacity:.95}
.clip .lab{position:absolute;left:6px;bottom:3px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none;display:flex;gap:5px;align-items:center;max-width:calc(100% - 10px);overflow:hidden}
.clip .badge{background:#000a;border-radius:4px;padding:0 4px}
.clip.aud{background-color:#f2b63233;background-repeat:no-repeat;background-size:100% 100%}
.clip.aud.a2{background-color:#3cc9a833}
.clip.aud.mut{opacity:.5}
.clip.ov{top:2px;bottom:2px;border-radius:5px;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap}
.clip.ov span{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip.t{background:#2a6fbf}
.clip.s{background:#8a49ad}
.clip.v2c{box-shadow:inset 0 0 0 2px var(--v2)}
.clip.v2c.sel{box-shadow:0 0 0 2px #fff}
.fadeL,.fadeR{position:absolute;top:0;bottom:0;pointer-events:none}
.fadeL{left:0;background:linear-gradient(to bottom right,#000a 50%,transparent 50%)}
.fadeR{right:0;background:linear-gradient(to bottom left,#000a 50%,transparent 50%)}
.h{position:absolute;top:-2px;bottom:-2px;width:14px;background:#fff;cursor:ew-resize;z-index:6;display:grid;place-items:center}
.h::after{content:"";width:2px;height:40%;background:#000;border-radius:2px}
.h.l{left:-7px;border-radius:6px 0 0 6px}
.h.r{right:-7px;border-radius:0 6px 6px 0}
.tr{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:6px;background:#fff;color:#000;z-index:7;display:grid;place-items:center;box-shadow:0 2px 6px #0008}
.tr svg{width:15px;height:15px;stroke-width:2.2}
.tr.on{background:var(--acc);color:#fff}
#dock{flex:none;background:var(--p1);border-top:1px solid var(--ln)}
#tools{display:flex;gap:2px;overflow-x:auto;padding:8px 10px;scrollbar-width:thin;scrollbar-color:var(--p3) transparent;scroll-behavior:smooth}
.tool{flex:none;width:74px;height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;color:#c9cfd8}
.tool:hover{background:var(--p2);color:#fff}
.tool.back{color:var(--acc)}
.tool.sep{width:1px;height:44px;background:var(--ln);margin:10px 6px;padding:0;pointer-events:none}
#panel{display:none;height:250px;flex-direction:column}
#panel.on{display:flex}
#tools.off{display:none}
.phd{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 16px;border-bottom:1px solid var(--ln);flex:none}
.phd h3{margin:0;font-size:15px;font-weight:600;flex:1}
.ok{width:38px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center}
.pbd{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:14px 28px;align-content:flex-start}
.fld{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1 1 220px;max-width:420px}
.fld.full{flex-basis:100%;max-width:none}
.fld>label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.fld>label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:9px;background:var(--p2);border:1px solid var(--ln);font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--mut)}
.chip.on{background:#ff4d6a26;border-color:var(--acc);color:#fff}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
input[type=color]{width:34px;height:30px;border:1px solid var(--ln);border-radius:8px;background:var(--p2);padding:2px}
textarea,select,input[type=text]{background:var(--p2);border:1px solid var(--ln);color:var(--ink);border-radius:9px;padding:8px 10px;font:16px Inter,sans-serif}
textarea{resize:vertical;min-height:62px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%}
.cell{aspect-ratio:1;border-radius:10px;background:var(--p2);border:1px solid var(--ln);display:grid;place-items:center;font-size:30px;overflow:hidden;padding:6px}
.cell:hover{border-color:var(--acc)}
.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.cell.fx{font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.cell.add{font-size:12px;color:var(--mut);text-align:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;width:100%}
.fcell{border-radius:10px;overflow:hidden;background:var(--p2);border:2px solid transparent;font-size:11px;text-align:center;padding-bottom:5px}
.fcell canvas{width:100%;aspect-ratio:16/10;display:block;margin-bottom:4px;background:#333}
.fcell.on{border-color:var(--acc)}
.tabs{display:flex;gap:4px;width:100%;border-bottom:1px solid var(--ln);margin:-4px 0 0}
.tab{padding:6px 12px 9px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:#fff;border-color:var(--acc)}
.note{font-size:12px;color:var(--mut);width:100%}
.pbar{height:8px;background:var(--p3);border-radius:8px;overflow:hidden;width:100%}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.box{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px}
.box h3{margin:0;font-size:20px}
.box p{margin:0;color:var(--mut)}
.row2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{height:40px;padding:0 16px;border-radius:10px;background:var(--p2);border:1px solid var(--ln)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#fff;color:#000;font-weight:600;padding:9px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#hidden{position:fixed;left:-10px;top:-10px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
kbd{background:var(--p3);border-radius:4px;padding:1px 6px;font:12px Inter}
@media(max-width:700px){#pname{width:120px}.hbtn span{display:none}#tc{min-width:0;font-size:11px}#zoom{display:none}}
@media(prefers-reduced-motion:reduce){#toast,.pbar i{transition:none}#tools{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></div>
  <input id="pname" value="YouCut video" aria-label="Nombre del proyecto">
  <div class="sp"></div>
  <button class="hbtn" id="btnNew" title="Nuevo proyecto"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M14 3v6h6 M12 12v6 M9 15h6"/></svg><span>Nuevo</span></button>
  <button class="hbtn" id="btnKeys" title="Atajos de teclado"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span>Atajos</span></button>
  <button class="hbtn" id="btnExport"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3 M7 8l5-5 5 5 M5 21h14"/></svg>Exportar</button>
</header>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="empty">
    <h2>Empieza tu montaje</h2>
    <p>Añade vídeos o fotos en HD. Luego suma música, texto, stickers, transiciones y efectos desde la barra de abajo.</p>
    <button class="big" id="btnFirst"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir vídeos o fotos</button>
    <p style="font-size:12px">También puedes arrastrar archivos aquí.</p>
  </div>
  <div id="drop">Suelta para añadir</div>
</div>
<div id="transport">
  <div id="tc"><b>00:00.0</b> / 00:00.0</div>
  <button class="ibtn" id="btnUndo" title="Deshacer (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="ibtn" id="btnRedo" title="Rehacer (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5 M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <button id="play" title="Reproducir (Espacio)"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4l13 8-13 8z"/></svg></button>
  <button class="ibtn" id="zOut" title="Alejar"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4 M8 11h6"/></svg></button>
  <input type="range" id="zoom" min="0" max="100" value="45" aria-label="Zoom de la línea de tiempo">
  <button class="ibtn" id="zIn" title="Acercar"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4 M8 11h6 M11 8v6"/></svg></button>
  <button class="ibtn" id="btnFull" title="Pantalla completa"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/></svg></button>
</div>
<div class="tw"><div id="tl"><div id="tli"></div></div><div id="ph"></div></div>
<div id="dock">
  <div id="tools"></div>
  <div id="panel"><div class="phd"><h3 id="ptitle"></h3><button class="ok" id="pok" title="Listo"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button></div><div class="pbd" id="pbody"></div></div>
</div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="hidden"></div>
<input type="file" id="fileIn" multiple hidden>
<script>
{
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0')};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const once=(el,ev)=>new Promise((res,rej)=>{el.addEventListener(ev,res,{once:true});el.addEventListener('error',rej,{once:true})});
const clone=o=>JSON.parse(JSON.stringify(o));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ============ iconos ============ */
const IC={
add:'<path d="M12 5v14M5 12h14"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
text:'<path d="M5 7V5h14v2 M12 5v14 M9 19h6"/>',
sticker:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
emoji:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c2 2 5 2 7 0 M9 9.5h.01 M15 9.5h.01"/>',
gif:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 10H8v4h2v-2 M13 10v4 M16 14v-4h2 M16 12h1.5"/>',
pip:'<rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/>',
split:'<path d="M12 3v18 M5 8l4 4-4 4 M19 8l-4 4 4 4"/>',
speed:'<path d="M12 14l4-5 M4 18a8 8 0 1 1 16 0"/>',
vol:'<path d="M4 9v6h4l5 4V5L8 9z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"/>',
fade:'<path d="M3 18L9 6h6l6 12"/>',
filter:'<circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/>',
adjust:'<path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
fx:'<path d="M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.5 2.5 M15.5 15.5L18 18 M18 6l-2.5 2.5 M8.5 15.5L6 18"/>',
trans:'<rect x="3" y="6" width="8" height="12" rx="1.5"/><rect x="13" y="6" width="8" height="12" rx="1.5"/>',
crop:'<path d="M6 2v14a2 2 0 0 0 2 2h14 M2 6h14a2 2 0 0 1 2 2v14"/>',
stab:'<circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5"/>',
ratio:'<rect x="3" y="7" width="18" height="10" rx="1.5"/><rect x="8" y="3" width="8" height="18" rx="1.5"/>',
bg:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/>',
dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
copy:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>',
paste:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z M12 10v7 M9 14l3 3 3-3"/>',
del:'<path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13"/>',
extract:'<path d="M9 16V5l9-2v11"/><circle cx="6.5" cy="16" r="2.5"/><path d="M15 21h6 M18 18v6"/>',
layer:'<path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/>',
anim:'<path d="M3 12c3-6 6-6 9 0s6 6 9 0"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
back:'<path d="M15 6l-6 6 6 6"/>',
mute:'<path d="M4 9v6h4l5 4V5L8 9z M16 9l5 6 M21 9l-5 6"/>',
img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
up:'<path d="M12 19V5 M6 11l6-6 6 6"/>',down:'<path d="M12 5v14 M6 13l6 6 6-6"/>'};
const ico=(k,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${IC[k]||''}</svg>`;

/* ============ catálogos ============ */

function total(){let m=0;const last=P.main[P.main.length-1];if(last)m=last._s+len(last);for(const k of['v2','a1','a2','text','stk'])for(const c of P[k])m=Math.max(m,c.start+len(c));return m}
function findClip(id){for(const t of TRK){const c=P[t.k].find(x=>x.id===id);if(c)return{k:t.k,c}}return null}

let AC=null,MASTER=null,REC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.connect(AC.destination);REC=AC.createMediaStreamDestination();MASTER.connect(REC)}return AC}

/* ============ fuentes (archivos) ============ */
function kindOf(f){const t=f.type||'';if(t==='image/gif'||/\.gif$/i.test(f.name))return'gif';if(t.startsWith('video')||/\.(mp4|mov|webm|mkv|m4v)$/i.test(f.name))return'video';if(t.startsWith('image'))return'image';if(t.startsWith('audio')||/\.(mp3|wav|m4a|aac|ogg|flac|opus)$/i.test(f.name))return'audio';return null}
async function addSource(file,id){
  const kind=kindOf(file);if(!kind)throw new Error('Formato no compatible: '+file.name);
  id=id||uid();const url=URL.createObjectURL(file);const s={id,file,url,kind,name:file.name,dur:0,w:0,h:0};SRC[id]=s;
  if(kind==='video'||kind==='audio'){const el=document.createElement(kind==='video'?'video':'audio');el.preload='metadata';el.muted=true;el.src=url;await once(el,'loadedmetadata');s.dur=el.duration;s.w=el.videoWidth||0;s.h=el.videoHeight||0;if(!isFinite(s.dur)){s.dur=1}}
  else{const im=new Image();im.src=url;await once(im,'load');s.w=im.naturalWidth;s.h=im.naturalHeight;s.img=im;if(kind==='gif')await decodeGif(s)}
  P.sources[id]={id,kind,name:file.name,dur:s.dur,w:s.w,h:s.h};
  genThumbs(s);if((kind==='audio'||kind==='video')&&file.size<250e6)genWave(s);
  idbPut('files',id,file);
  return s}
async function decodeGif(s){
  if(!('ImageDecoder' in window))return;
  try{const dec=new ImageDecoder({data:await s.file.arrayBuffer(),type:s.file.type||'image/gif'});await dec.tracks.ready;await dec.completed;const n=Math.min(dec.tracks.selectedTrack.frameCount,400);const fr=[];let acc=0;
    for(let i=0;i<n;i++){const {image}=await dec.decode({frameIndex:i});const d=(image.duration||100000)/1e6;const b=await createImageBitmap(image);image.close();fr.push({b,t:acc,d:Math.max(d,.02)});acc+=Math.max(d,.02)}
    if(fr.length>1){s.frames=fr;s.gdur=acc;s.dur=acc}}catch(e){}}
function gifFrame(s,t){if(!s.frames)return s.img;const tt=((t%s.gdur)+s.gdur)%s.gdur;let lo=0,hi=s.frames.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(s.frames[m].t<=tt)lo=m;else hi=m-1}return s.frames[lo].b}
async function genThumbs(s){
  const th=48;const asp=s.w&&s.h?s.w/s.h:16/9;const tw=Math.round(clamp(th*asp,30,96));s.tw=tw;s.th=th;
  const cv=document.createElement('canvas');const x=cv.getContext('2d');
  if(s.kind!=='video'){if(s.kind==='audio')return;cv.width=tw;cv.height=th;drawCover(x,s.img,s.w,s.h,tw,th);s.strip=cv.toDataURL('image/jpeg',.7);s.n=1;renderTL();return}
  const n=Math.round(clamp(s.dur/1.5,3,220));s.n=n;cv.width=tw*n;cv.height=th;x.fillStyle='#222';x.fillRect(0,0,cv.width,th);
  const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=s.url;$('#hidden').appendChild(v);
  try{await once(v,'loadeddata');
  for(let i=0;i<n;i++){v.currentTime=Math.min(s.dur-.05,(i+.5)*s.dur/n);await once(v,'seeked');drawCover(x,v,s.w,s.h,tw,th,i*tw);if(i%12===11||i===n-1||i===0){s.strip=cv.toDataURL('image/jpeg',.65);renderTL()}}}catch(e){}
  v.remove()}
function drawCover(x,img,w,h,tw,th,ox=0){const sc=Math.max(tw/w,th/h);x.drawImage(img,ox+(tw-w*sc)/2,(th-h*sc)/2,w*sc,h*sc)}
async function genWave(s){
  try{const buf=await ac().decodeAudioData(await s.file.arrayBuffer());const W=Math.min(8000,Math.ceil(buf.duration*40)),H=60;const d0=buf.getChannelData(0),d1=buf.numberOfChannels>1?buf.getChannelData(1):d0;const step=Math.floor(d0.length/W);
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#ffffffcc';
    for(let i=0;i<W;i++){let m=0;const o=i*step;for(let j=0;j<step;j+=8){const v=Math.abs(d0[o+j])+Math.abs(d1[o+j]);if(v>m)m=v}const hh=Math.max(1,Math.min(1,m/2)*H*.9);x.fillRect(i,(H-hh)/2,1,hh)}
    s.wave=cv.toDataURL('image/png');renderTL()}catch(e){}}

/* ============ elementos por clip ============ */
function needsEl(k,c){const s=SRC[c.src];return s&&(s.kind==='video'||s.kind==='audio')}
function syncRT(){
  const live=new Set();
  for(const k of['main','v2','a1','a2'])for(const c of P[k]){if(!needsEl(k,c))continue;live.add(c.id);if(!RT.has(c.id)){const s=SRC[c.src];const isA=k[0]==='a'||s.kind==='audio';const el=document.createElement(isA?'audio':'video');el.preload='auto';el.playsInline=true;el.src=s.url;el.crossOrigin='anonymous';$('#hidden').appendChild(el);
      const r={el,k};try{const a=ac();r.node=a.createMediaElementSource(el);r.gain=a.createGain();r.gain.gain.value=0;r.node.connect(r.gain);r.gain.connect(MASTER)}catch(e){}
      el.addEventListener('seeked',()=>dirty=true);el.addEventListener('loadeddata',()=>dirty=true);RT.set(c.id,r)}
    RT.get(c.id).k=k}
  for(const [id,r] of RT)if(!live.has(id)){r.el.pause();r.el.removeAttribute('src');r.el.load();r.el.remove();try{r.node.disconnect();r.gain.disconnect()}catch(e){}RT.delete(id)}}

function audioGain(k,c,t,i){
  const s=startOf(k,c),L=len(c),lt=t-s;if(c.muted)return 0;let g=c.vol??1;
  if(c.fin>0)g*=clamp(lt/c.fin,0,1);if(c.fout>0)g*=clamp((L-lt)/c.fout,0,1);
  if(k==='main'){if(c._td>0&&lt>L-c._td)g*=clamp((L-lt)/c._td,0,1);const pv=P.main[i-1];if(pv&&pv._td>0&&lt<pv._td)g*=clamp(lt/pv._td,0,1)}
  return g}
function syncMedia(t){
  const now=AC?AC.currentTime:0;
  for(const k of['main','v2','a1','a2'])P[k].forEach((c,i)=>{const r=RT.get(c.id);if(!r)return;const el=r.el;const s=startOf(k,c),L=len(c),src=c.in+(t-s)*c.speed;const act=t>=s&&t<s+L;
    if(act){el.playbackRate=c.speed;if('preservesPitch' in el)el.preservesPitch=c.pitch!==false;
      if(playing){if(el.paused){if(Math.abs(el.currentTime-src)>.08)el.currentTime=src;el.play().catch(()=>{})}else if(Math.abs(el.currentTime-src)>.3)el.currentTime=src}
      else{if(!el.paused)el.pause();if(!el.seeking&&Math.abs(el.currentTime-src)>.04)el.currentTime=src}}
    else{if(!el.paused)el.pause();if(t<s&&s-t<2&&!el.seeking&&Math.abs(el.currentTime-c.in)>.1)el.currentTime=c.in}
    if(r.gain){const g=act&&(playing||exporting)?audioGain(k,c,t,i):0;r.gain.gain.setTargetAtTime(g,now,.012)}})}

/* ============ render ============ */
const cv=$('#cv'),ctx=cv.getContext('2d');let bounds=[];
let grainPat=null;function grain(){if(grainPat)return grainPat;const g=document.createElement('canvas');g.width=g.height=256;const x=g.getContext('2d'),d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);grainPat=g;return g}
function filterStr(c){const f=FILTERS.find(f=>f[0]===(c.filter||'Original'))?.[1]||{};const k=c.fint??1;const a=c.adj||{};const L=(v,d)=>d+(v-d)*k;
  let s='';const bri=L(f.bri??1,1)*(1+(a.bri||0)/100),con=L(f.con??1,1)*(1+(a.con||0)/100),sat=L(f.sat??1,1)*(1+(a.sat||0)/100);
  if(bri!==1)s+=`brightness(${bri}) `;if(con!==1)s+=`contrast(${con}) `;if(sat!==1)s+=`saturate(${sat}) `;
  if(f.sepia)s+=`sepia(${f.sepia*k}) `;if(f.gray)s+=`grayscale(${f.gray*k}) `;const hue=(f.hue||0)*k+(a.hue||0);if(hue)s+=`hue-rotate(${hue}deg) `;if(a.blur)s+=`blur(${a.blur}px) `;return s||'none'}
function drawable(c,lt){const s=SRC[c.src];if(!s)return null;
  if(s.kind==='video'){const r=RT.get(c.id);if(!r||r.el.readyState<2)return null;return{img:r.el,w:s.w,h:s.h}}
  if(s.kind==='gif')return{img:gifFrame(s,c.in+lt*c.speed),w:s.w,h:s.h};if(s.kind==='image')return{img:s.img,w:s.w,h:s.h};return null}
function stabAt(c,srcT){const d=c.stab>0&&STAB[c.skey];if(!d)return null;const a=d.pts;let lo=0,hi=a.length-1;if(hi<0)return null;while(lo<hi){const m=(lo+hi+1)>>1;if(a[m][0]<=srcT)lo=m;else hi=m-1}const p=a[lo];const w=[0,.35,.65,1][c.stab];return{dx:p[1]*w,dy:p[2]*w,z:1+[0,.06,.1,.14][c.stab]}}
/* dibuja un clip visual llenando el rectángulo W×H (cuadro principal) o un rectángulo de capa */
function drawVisual(x,c,W,H,t,k,o={}){
  const s=startOf(k,c),lt=t-s,L=len(c);const D=drawable(c,lt);if(!D)return false;
  const srcT=c.in+lt*c.speed;const rot=(c.rot||0)%360,sw=rot%180?D.h:D.w,sh=rot%180?D.w:D.h;
  let sc=(c.fit==='fill'?Math.max(W/sw,H/sh):Math.min(W/sw,H/sh))*(c.zoom||1);
  let cx=W/2+(c.px||0)*W,cy=H/2+(c.py||0)*H;const st=stabAt(c,srcT);if(st){sc*=st.z;cx+=st.dx*sw*sc;cy+=st.dy*sh*sc}
  if(c.fx==='kenburns'){sc*=1+.12*clamp(lt/L,0,1)}
  if(c.fx==='shake'){const q=Math.floor(t*20);cx+=(rnd(q)-.5)*W*.015;cy+=(rnd(q+9)-.5)*H*.015}
  let al=o.alpha??1;if(c.vfin>0)al*=clamp(lt/c.vfin,0,1);if(c.vfout>0)al*=clamp((L-lt)/c.vfout,0,1);

async function analyze(c){

    const ok=c=>!c.src||SRC[c.src];for(const k of['main','v2','a1','a2','stk'])p[k]=p[k].filter(ok);P=p;hist=[];fut=[];afterLoad();$('#modal').classList.remove('on');seek(0)}}

$('#play').onclick=toggle;$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnExport').onclick=exportDialog;$('#btnFirst').onclick=()=>addTo('main');
$('#pname').oninput=e=>{P.name=e.target.value;saveSoon()};
$('#btnFull').onclick=()=>{const el=$('#stage');(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.())?.catch?.(()=>{})};
$('#btnNew').onclick=()=>{const m=$('#mbox');m.innerHTML=`<h3>¿Nuevo proyecto?</h3><p>Se cerrará el montaje actual. Puedes deshacerlo con Ctrl+Z mientras no recargues la página.</p><div class="row2"><button class="sec" id="mx">Cancelar</button><button class="big" id="mok">Nuevo proyecto</button></div>`;$('#modal').classList.add('on');$('#mx').onclick=()=>$('#modal').classList.remove('on');$('#mok').onclick=()=>{const b=snap();P=newProject();sel=null;time=0;commit(b);afterLoad();$('#modal').classList.remove('on')}};
$('#btnKeys').onclick=()=>{const m=$('#mbox');const K=[['Espacio','Reproducir / pausa'],['S','Dividir en el cabezal'],['Supr','Eliminar seleccionado'],['Ctrl+C / Ctrl+V','Copiar / pegar'],['Ctrl+D','Duplicar'],['Ctrl+Z / Ctrl+Y','Deshacer / rehacer'],['← →','Mover un fotograma (Mayús: 1 s)'],['Inicio / Fin','Ir al principio / final'],['Ctrl + rueda','Zoom de la línea de tiempo'],['Rueda en la vista previa','Tamaño de la capa seleccionada'],['Esc','Cerrar panel / deseleccionar']];m.innerHTML=`<h3>Atajos de teclado</h3>${K.map(k=>`<div style="display:flex;justify-content:space-between;gap:10px"><kbd>${k[0]}</kbd><span style="color:var(--mut)">${k[1]}</span></div>`).join('')}<div class="row2"><button class="sec" id="mx">Cerrar</button></div>`;$('#modal').classList.add('on');$('#mx').onclick=()=>$('#modal').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if($('#modal').classList.contains('on')){if(e.key==='Escape'&&!exporting)$('#modal').classList.remove('on');return}const c=e.ctrlKey||e.metaKey;const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();toggle()}else if(c&&k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(c&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo()}
  else if(c&&k==='c')copySel();else if(c&&k==='v')paste();else if(c&&k==='d'){e.preventDefault();duplicate()}else if(k==='s'&&!c)split();else if(k==='delete'||k==='backspace')delSel();
  else if(k==='arrowleft'||k==='arrowright'){e.preventDefault();seek(time+(k==='arrowleft'?-1:1)*(e.shiftKey?1:1/P.fps))}else if(k==='home')seek(0);else if(k==='end')seek(total());else if(k==='escape'){if(panelTool)closePanel();else deselect()}else if(k==='+'||k==='=')setZoom(pps*1.3);else if(k==='-')setZoom(pps/1.3)});
let dragDepth=0;const dr=$('#drop');
window.addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){dragDepth++;dr.style.display='flex'}});window.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;dr.style.display='none'}});window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;dr.style.display='none';const fs=[...e.dataTransfer.files];const vis=fs.filter(f=>kindOf(f)&&kindOf(f)!=='audio'),aud=fs.filter(f=>kindOf(f)==='audio');if(vis.length)importFiles(vis,'main').then(()=>aud.length&&importFiles(aud,'a1'));else if(aud.length)importFiles(aud,'a1')});
window.addEventListener('resize',()=>renderTL());

/* inicio */
setZoom(60);renderTools();renderTL();updBtns();sizeCanvas();requestAnimationFrame(tick);tryRestore();
window.__yc={get P(){return P},SRC,RT,importFiles,seek,play,pause,split,select,openTool,get time(){return time},total,analyze,STAB,startExport};
}
